name: 🚀 Deploy to Server via SSH

on:
  push:
    branches:
      - newbranch

jobs:
  deploy:
    name: Deploy Code to Server
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy to Remote Server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo "Connecting to $SERVER_USER@$SERVER_IP..."
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
          cd /var/www/dashboard      # <-- Your deployment directory
          git pull origin dashboard         # <-- Pull latest code
          #npm install                  # <-- Install dependencies (optional)
          #pm2 restart all              # <-- Restart app (optional)
          EOF
